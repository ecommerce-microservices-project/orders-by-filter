spring.application.name=orders-by-filter

server.port=${SERVER_PORT:9084}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/${DB_NAME:order_db}

spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:G0dsk!d0}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

eureka.instance.hostname= localhost
eureka.client.register-with-eureka= true
eureka.client.fetch-registry= true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/


# ==== RETRY MECHANISMS ====
# Total number of attempts (1 original call + 2 retries)
resilience4j.retry.instances.getOrdersRetry.max-attempts=3
# Wait 2 seconds (2000 ms) before trying again
resilience4j.retry.instances.getOrdersRetry.wait-duration=10000


# ===== RATE LIMITER ======
# Allow a maximum of 3 calls
resilience4j.ratelimiter.instances.orderRateLimiter.limit-for-period=3
# The refresh period window (10 seconds)
resilience4j.ratelimiter.instances.orderRateLimiter.limit-refresh-period=10s
# If a request gets blocked, how long should it wait in line before failing immediately (0 means fail instantly)
resilience4j.ratelimiter.instances.orderRateLimiter.timeout-duration=50ms
# Enable an event consumer buffer size of 10 events i.e. history
resilience4j.ratelimiter.instances.orderRateLimiter.subscribe-for-events=true
resilience4j.ratelimiter.instances.orderRateLimiter.event-consumer-buffer-size=30

# ===== TIME LIMITER =====
resilience4j.ratelimiter.instances.orderTimeLimiter.timeout-duration=3

# ==== ZIPKIN ===
management.tracing.sampling.probability= 1.0
